<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Tower Rouge Like!</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="game-ui.css">
        <script src="main.js" defer></script>
    </head>
    <body>
        <div id="game-container">
            <canvas id="canvas" class="ignore-on-click"></canvas>
            
            <div id="game-ui-container" class="ignore-on-click">
                <span id="currency-text" class="ignore-on-click">Currency: 0</span>

                <span id="wave-text" class="ignore-on-click">Wave: 1</span>

                <div id="tower-health-background-bar"></div>
                <div id="tower-health-bar"></div>
                <span id="tower-health-text">100 / 100</span>

                <div id="tower-upgrades-menu">
                    <span id="tower-upgrades-open-close">Open</span>
                </div>
            </div>
        </div>
    </body>
</html>
