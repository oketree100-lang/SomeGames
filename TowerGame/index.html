<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Tower Rouge Like!</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="game-ui.css">
        <script type="module" src="main.js" defer></script>
    </head>
    <body>
        <div id="game-container">
            <canvas id="canvas"></canvas>
            
            <div id="game-ui-container">
                <div id="values-container">
                    <span id="currency-text">Currency: 0</span>
                    <span id="gems-text">Gems: 0</span>
                </div>

                <div id="wave-info-container">
                    <span id="wave-text">Wave: 1</span>
                    <div id="wave-progress-bar"></div>
                </div>

                <div id=enemy-info-container>
                    <span id="enemy-health-text">Health: 1</span>
                    <span id="enemy-damage-text">Damage: 1</span>
                </div>

                <div id="health-bar-container">
                    <div id="tower-health-background-bar"></div>
                    <div id="tower-health-bar"></div>
                    <span id="tower-health-text">100 / 100</span>
                </div>

                <div id="tower-upgrades-menu">
                    <span id="tower-upgrades-open-close">Open</span>
                    <div id="tower-upgrades-container">
                        <div class="upgrade" id="tower-attack-speed-upgrade">
                            <span>Attack Speed</span>
                            <span class="upgrade-value">1</span>
                            <span class="buy-button">1C</span>
                        </div>
                        <div class="upgrade" id="tower-damage-upgrade">
                            <span>Damage</span>
                            <span class="upgrade-value">1</span>
                            <span class="buy-button">1C</span>
                        </div>
                        <div class="upgrade" id="tower-regeneration-upgrade">
                            <span>Regeneration</span>
                            <span class="upgrade-value">1</span>
                            <span class="buy-button">1C</span>
                        </div>
                        <div class="upgrade" id="tower-max-health-upgrade">
                            <span>Max Health</span>
                            <span class="upgrade-value">101</span>
                            <span class="buy-button">1C</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
